version: '3.8'

services:
  # ============================================================================
  # 1. Catálogo de Filmes (Único Ponto de Entrada Público)
  # ============================================================================
  catalog:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - AUTH_SERVICE_URL=http://auth-service:4000
      - LOG_SERVICE_URL=http://log-service:5000
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-perfil-usuarios}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9000}
    depends_on:
      - auth-service
      - log-service
      - minio
    networks:
      - internal-net
    restart: unless-stopped

  # ============================================================================
  # 2. Microsserviço de Autenticação (Acesso Exclusivo na Rede Interna do Docker)
  #    - Sem 'ports:' mapeado para o host. Fica invisível para a internet.
  #    - Gerencia: login, cadastro, papéis (roles), esqueci minha senha e tokens de expiração.
  # ============================================================================
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    expose:
      - "4000"
    environment:
      - PORT=4000
      - LOG_SERVICE_URL=http://log-service:5000
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - SMTP_HOST=${SMTP_HOST:-sandbox.smtp.mailtrap.io}
      - SMTP_PORT=${SMTP_PORT:-2525}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM:-nao-responda@catalogofilmes.com}
    depends_on:
      - log-service
    networks:
      - internal-net
    restart: unless-stopped

  # ============================================================================
  # 3. Microsserviço de Logs e Auditoria (Rede Interna)
  #    - Sem 'ports:' mapeado para o host. Apenas comunicação inter-serviços.
  #    - Grava e consulta eventos de comportamento do usuário via Redis Streams.
  # ============================================================================
  log-service:
    build:
      context: ./log-service
      dockerfile: Dockerfile
    expose:
      - "5000"
    environment:
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - STREAM_KEY=audit:events
    depends_on:
      - redis
    networks:
      - internal-net
    restart: unless-stopped

  # ============================================================================
  # 4. Redis - Persistência de Logs de Auditoria em Streams
  #    - Sem porta exposta externamente. Acesso exclusivo aos microsserviços.
  # ============================================================================
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - internal-net
    restart: unless-stopped

  # ============================================================================
  # 5. MinIO - Object Storage para Fotos de Perfil
  #    - Bucket dedicado para avatares ('perfil-usuarios')
  #    - API S3 na porta 9000 e Console Web na porta 9001
  # ============================================================================
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio-data:/data
    networks:
      - internal-net
    restart: unless-stopped

networks:
  internal-net:
    driver: bridge

volumes:
  redis-data:
  minio-data:
